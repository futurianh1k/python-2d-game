name: Python 3.14

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - run: python -W error -m compileall -q pythongame tests run.py map_editor.py
      - run: python -m pytest --cov --cov-report=term --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/junit.xml --log-file=artifacts/pytest.log --log-file-level=DEBUG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/
